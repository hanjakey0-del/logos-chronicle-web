<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>로고스 크로니클</title>
    <link rel="icon" href="data:," />
    <style>html,body{color:#f5f0e6;background:#120e1e;height:100%;margin:0;overflow:hidden}body{overscroll-behavior:none;height:100dvh}#game{touch-action:none;-webkit-user-select:none;user-select:none;max-width:480px;height:100%;margin:0 auto;position:relative}#boot-loader{z-index:10;box-sizing:border-box;text-align:center;pointer-events:none;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;font:15px/1.6 Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;display:flex;position:fixed;inset:0}#boot-track{background:#3a3154;border-radius:4px;width:220px;height:8px;position:relative;overflow:hidden}#boot-track:after{content:"";background:linear-gradient(90deg,#0000,#ffffff8c,#0000);width:40%;height:100%;animation:1.4s linear infinite boot-shine;position:absolute;top:0;left:0}@keyframes boot-shine{0%{transform:translate(-100%)}to{transform:translate(250%)}}#boot-bar{transform-origin:0;background:#f5c542;border-radius:4px;width:100%;height:100%;transition:transform .3s ease-out;transform:scaleX(0)}#boot-reload{color:#1e1830;pointer-events:auto;background:#f5c542;border:0;border-radius:8px;min-width:160px;min-height:44px;font:700 14px Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;display:none}</style>
    <script type="module" crossorigin src="./assets/index-mpO8kwkh.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <!-- 게임 코드를 받기 전부터 보이는 로딩 화면. 외부 파일 없이 이 문서만으로 표시된다. -->
    <div id="boot-loader" role="status" aria-live="polite">
      <div id="boot-message">게임을 준비하고 있어요</div>
      <div id="boot-track"><div id="boot-bar"></div></div>
      <button id="boot-reload" type="button" onclick="location.reload()">새로고침</button>
    </div>
    <script>
      (function () {
        var SCRIPT_TIMEOUT_MS = 30000;
        var bar = document.getElementById('boot-bar');

        // 게임 코드를 받는 동안에는 진행률을 알 수 없으므로 느린 망에서도 멈춰 보이지 않게 오래 채운다.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            if (window.__logosBootStarted) return;
            bar.style.transition = 'transform 30s cubic-bezier(0.08, 0.8, 0.2, 1)';
            bar.style.transform = 'scaleX(0.35)';
          });
        });

        function fail(message) {
          if (window.__logosBootStarted) return;
          document.getElementById('boot-message').textContent = message;
          document.getElementById('boot-track').style.display = 'none';
          document.getElementById('boot-reload').style.display = 'block';
        }

        var FAILED = '게임을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';
        window.addEventListener('error', function () { fail(FAILED); }, true);
        setTimeout(function () { fail(FAILED); }, SCRIPT_TIMEOUT_MS);
      })();
    </script>
    <script nomodule>
      document.getElementById('boot-message').textContent = '이 브라우저에서는 게임을 실행할 수 없어요. 크롬, 사파리, 삼성 인터넷의 최신 버전으로 열어 주세요.';
      document.getElementById('boot-track').style.display = 'none';
    </script>
  </body>
</html>
